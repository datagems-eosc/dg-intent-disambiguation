  - query: "Any open data on subway ridership?"
  - query: "Search for datasets about occupational skills taxonomies"
  - query: "What data do you have on renewable energy?"
  - query: "List datasets related to climate change in the Mediterranean"
  - query: "Do you host the ESCO classification?"
  - query: "Data sources for wildfire occurrences in Greece"
  - query: "Is there a dataset with hourly temperature measurements for Thessaloniki?"
  - query: "I'm looking for data on the job market for engineers"
  - query: "Which collections cover historical texts from the 19th century?"
  - query: "Recommend datasets for studying heatwaves"
  - query: "Γνωρίζεις αν υπάρχουν δεδομένα για τη ρύπανση του αέρα στην Αθήνα;"
  - query: "Ψάχνω σύνολα δεδομένων για τη βροχόπτωση στην Κρήτη"
  - query: "jeux de données sur la qualité de l'air à Paris"
  - query: "Gibt es Datensätze über Arbeitslosigkeit in Österreich?"
  - query: "¿Tienen datos sobre emisiones de gases de efecto invernadero en España?"
  - query: "datasets with student assessment results"
  - query: "open datasets on zoo animal populations"
  - query: "Do you have any linguistic corpora annotated with sentiment?"
  - query: "Looking for skill forecast data from CEDEFOP"
  - query: "What kinds of weather data are available on the platform?"
  - query: "I want to browse datasets about education in Portugal"
  - query: "Are there datasets I could use to study unemployment trends?"
  - query: "air quality datasets"
  - query: "Find a dataset that has both temperature and humidity for Greek cities"
  - query: "Point me to data about public transport delays"
  - query: "show me other datasets like these"
    context: { dataset_ids: ["2f1c0f4e-3b8e-4a8d-9a52-0d4f3f6c1a10", "6b7e2d1a-9c4f-4e3b-8f2a-1d5c7e9b3a20"] }

    context:
      dataset_ids: ["2f1c0f4e-3b8e-4a8d-9a52-0d4f3f6c1a10"]
      history: ["What was the mean temperature in Athens in 2020?"]
  - query: "I need data for my thesis on Mediterranean droughts"
  - query: "what datasets would help me analyse youth unemployment?"
  - query: "can i download the ERA5 temperature files"


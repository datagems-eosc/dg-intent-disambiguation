  - query: "Number of heatwave days per year in Athens since 2000"
    note: "No question word, but asks for a computed value"
  - query: "and per month?"
    context:
      dataset_ids: ["2f1c0f4e-3b8e-4a8d-9a52-0d4f3f6c1a10"]
      history: ["What was the mean temperature in Athens in 2020?"]
  - query: "what about Thessaloniki?"
    context:
      dataset_ids: ["2f1c0f4e-3b8e-4a8d-9a52-0d4f3f6c1a10", "6b7e2d1a-9c4f-4e3b-8f2a-1d5c7e9b3a20"]
      history: ["Show the daily rainfall in Patras for 2022"]
  - query: "compare it with 2019"
    context:
      dataset_ids: ["9b25bc46-8bd3-4f7f-94b4-52dbc38c130f"]
      history: ["How many students passed the probability assessment in 2020?"]
  - query: "how many students failed calculus last year"
  - query: "find datasets on Athens temperature and tell me the mean for 2020"
    note: "Asks for both; the question flow finds the datasets anyway"
  - query: "temprature athens july 2021 max"
    note: "Keyword style with typos, but 'max' asks for a value"
  - query: "I need the average monthly rainfall in Crete for my thesis"


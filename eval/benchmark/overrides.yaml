# Decisions on the inputs where the judges did not both agree with the generated intent.
#
# Rules applied:
# - Strict relabel when both judges agree on a label that is clearly right in context, or
#   the input explicitly asks for one thing (e.g. "give me a table of ...").
# - Bare noun phrases or keywords without consensus are contested: ambiguous,
#   dataset_search and question are all reasonable; only out_of_scope is wrong.
# - Noun phrases with a value word (trend, rate, totals, by country) accept question or
#   ambiguous.
# - Requests for learning material accept every data flow; MathE material is data.
# - Questions about a dataset itself (access, API, licence, citation, definitions) accept
#   dataset_search, question or out_of_scope: the four intents do not model them.
#
# Keys are benchmark ids. `intent` alone relabels; `acceptable` marks the input as
# contested (scored leniently, outside the strict accuracy); `drop: true` removes it.


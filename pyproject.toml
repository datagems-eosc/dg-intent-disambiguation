[project]
name = "intent_disambiguation"
version = "0.1.0"
description = "Intent disambiguation service of the DataGEMS platform"
authors = [{ name = "DataGEMS", email = "mxydas@athenarc.gr" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "structlog>=24.1.0",
    "pyjwt[crypto]>=2.10.0",
    "pyyaml>=6.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pre-commit>=3.7.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["intent_disambiguation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live_llm'"
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient. is deprecated"]
markers = [
    "live_llm: calls the real SCAYLE LLM (needs VPN and SCAYLE_* credentials in .env)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are meant to be used as argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

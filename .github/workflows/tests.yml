name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/0.6.8/install.sh | sh

      - name: Lint
        run: |
          uv lock --locked
          uv run --locked ruff check .
          uv run --locked ruff format --check .

      # Live LLM tests are excluded by default (no VPN on GitHub runners)
      - name: Unit tests
        run: uv run --locked python -m pytest

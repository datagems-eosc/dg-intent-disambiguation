site_name: Intent Disambiguation Docs

site_url: https://datagems-eosc.github.io/dg-intent-disambiguation/
repo_url: https://github.com/datagems-eosc/dg-intent-disambiguation/


nav:
  - Overview: index.md
  - System:
    - Architecture: architecture.md
    - Intent Classification: intent-classification.md
    - Evaluation: evaluation.md
    - Security: security.md
  - API:
    - Overview: api-overview.md
    - Status & Error Codes: error-codes.md
    - OpenAPI: openapi.md
    - Integration Guide: integration.md
  - Setup & Monitoring:
    - Deployment: deployment.md
    - Configuration: configuration.md
    - Logging: logging.md
    - Maintenance: maintenance.md
  - FAQ: faq.md
  - License: license.md
  - Home: https://datagems-eosc.github.io/

theme:
  name: 'material'
  favicon: images/favicon.jpg
  logo: images/datagems-portal-icon.png
  icon:
    repo: fontawesome/brands/github
  custom_dir: overrides
  features:
    - navigation.path
    - navigation.top

extra_css:
  - stylesheets/custom-footer.css
  - stylesheets/mkdocsoad.css

plugins:
  - search
  - mike
  - neoteroi.mkdocsoad:
      use_pymdownx: true

markdown_extensions:
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - admonition
  - tables

extra:
  version:
    provider: mike
    alias: true
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/datagems-eosc/
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/eosc-datagems
